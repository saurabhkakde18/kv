<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KV FLASH — Luxury Lending Reference Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4AF37">
</head>
<body class="theme-dark">
  <!-- APP SHELL CONTAINER (Mobile Frame / Full Desktop Responsive) -->
  <div class="app-container">
    
    <!-- TOP APP BAR -->
    <header class="top-bar">
      <div class="brand-group">
        <div class="logo-crest">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <div class="title-row">
            <span class="app-title">KV FLASH</span>
          </div>
          <span style="display: block; font-size: 11px; color: var(--gold-light); font-weight: 500; letter-spacing: 0.3px; margin: 2px 0 3px 0; font-style: italic;">"You're one step closer to what you want"</span>
          <span class="app-subtitle" id="data-version-tag">v1.0.0 • Updated: 2026-10-07</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="btn-fav-shortcut" title="Starred Favorites">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span class="fav-bubble" id="fav-count-bubble" style="display: none;">0</span>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings & Importer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-profile-shortcut" title="Employee Profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
        <button class="icon-btn" id="btn-logout-shortcut" title="Sign Out" style="display: none; color: #EF4444;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- GLOBAL SEARCH BAR -->
    <div class="search-section">
      <div class="search-box-wrapper" id="global-search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="global-search-input" placeholder="Search any car, CV, Bolero, policy, payout, IRR…" autocomplete="off" />
        <button class="btn-clear-search" id="btn-clear-search" style="display: none;">✕</button>
        <button class="btn-mic" id="btn-voice-search" title="Voice Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>

      <!-- SEARCH FILTER CHIPS (VISIBLE DURING SEARCH) -->
      <div class="search-chips-row" id="search-filter-chips" style="display: none;">
        <button class="chip active" data-filter="ALL">All Results</button>
        <button class="chip" data-filter="approved_cars">Cars</button>
        <button class="chip" data-filter="bolero_pickup_grid">Bolero</button>
        <button class="chip" data-filter="cv_grid">CV Grid</button>
        <button class="chip" data-filter="dsa_payout">Payout</button>
        <button class="chip" data-filter="irr_matrix">IRR</button>
        <button class="chip" data-filter="charges">Charges</button>
        <button class="chip" data-filter="car_policy">Policy</button>
        <button class="chip" data-filter="documents">Docs</button>
        <button class="chip" data-filter="new_lead">Lead</button>
        <button class="chip" data-filter="contacts">Contacts</button>
      </div>
    </div>

    <!-- PERSISTENT LUXURY TAB ROW (ALL 14 MODULES) -->
    <nav class="nav-tab-row" id="header-tabs">
      <button class="tab-item active" data-tab="dashboard">🏠 Dashboard</button>
      <button class="tab-item" data-tab="car_policy">📋 Car Policy</button>
      <button class="tab-item" data-tab="approved_cars">🚗 Approved Car</button>
      <button class="tab-item" data-tab="cv_grid">🚛 CV Grid</button>
      <button class="tab-item" data-tab="cv_policy">📜 CV Policy</button>
      <button class="tab-item" data-tab="bolero_pickup_grid">🚙 Bolero Pickup Grid</button>
      <button class="tab-item" data-tab="charges">🏷️ Charges</button>
      <button class="tab-item" data-tab="dsa_payout">💰 DSA Payout</button>
      <button class="tab-item" data-tab="irr_matrix">📊 IRR Matrix</button>
      <button class="tab-item" data-tab="emi_calculator">🧮 EMI Calculator</button>
      <button class="tab-item" data-tab="valuation_calculator">🚙 Valuation Tool</button>
      <button class="tab-item" data-tab="documents">📁 Documents</button>
      <button class="tab-item" data-tab="new_lead">🚀 Log Lead</button>
      <button class="tab-item" data-tab="contacts">📞 Contacts</button>
      <button class="tab-item" data-tab="favorites">⭐ Favorites</button>
      <button class="tab-item" data-tab="profile">👤 Profile</button>
    </nav>

    <!-- DYNAMIC MAIN CONTENT VIEWPORT -->
    <main class="main-viewport" id="main-content">
      <!-- Dynamic View Injected via app.js -->
    </main>

    <!-- ANDROID OS NAVIGATION BAR -->
    <div class="android-nav-bar" id="android-nav" style="display: none;">
      <button id="nav-back" title="Back">
        <svg viewBox="0 0 24 24"><polygon points="16,4 6,12 16,20"></polygon></svg>
      </button>
      <button id="nav-home" title="Home">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle></svg>
      </button>
      <button id="nav-recent" title="Recent Screens">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" ry="2"></rect></svg>
      </button>
    </div>

  </div>

  <!-- DETAIL BOTTOM SHEET MODAL -->
  <div class="bottom-sheet-overlay" id="detail-sheet-overlay">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <h3 class="sheet-title" id="sheet-title">Record Details</h3>
          <p class="sheet-subtitle" id="sheet-subtitle">Detailed Specifications & Lending Parameters</p>
        </div>
        <div class="sheet-actions">
          <button class="icon-btn" id="sheet-btn-star" title="Star Favorite">⭐</button>
          <button class="icon-btn" id="sheet-btn-close">✕</button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body">
        <!-- Key/Value Pairs -->
      </div>
      <div class="sheet-footer">
        <button class="btn btn-secondary" id="sheet-btn-copy">📋 Copy Details</button>
        <button class="btn btn-primary" id="sheet-btn-share">🚀 Share Quote (WhatsApp)</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS & DATA IMPORTER MODAL -->
  <div class="modal-overlay" id="settings-modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ Settings & Preferences</h3>
        <button class="icon-btn" id="modal-btn-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label class="section-label">Theme Mode</label>
          <div class="theme-switch-row" style="display: flex; flex-wrap: wrap; gap: 8px;">
            <button class="btn-toggle active" id="btn-theme-dark">Luxury Dark</button>
            <button class="btn-toggle" id="btn-theme-light">Gold Light</button>
            <button class="btn-toggle" id="btn-theme-sapphire">Sapphire Dark</button>
            <button class="btn-toggle" id="btn-theme-crimson">Crimson Light</button>
            <button class="btn-toggle" id="btn-theme-emerald">Emerald Dark</button>
            <button class="btn-toggle" id="btn-theme-sage">Sage Beige</button>
          </div>
        </div>

        <div class="settings-group">
          <label class="section-label">Security & App Lock</label>
          <div class="setting-row">
            <div>
              <strong>Confidential App PIN Lock</strong>
              <p class="subtext">Protect grids with PIN (Default: 1234)</p>
            </div>
            <input type="checkbox" id="toggle-app-lock" class="custom-toggle" />
          </div>
        </div>

        <div class="settings-group">
          <label class="section-label">Reset Factory Defaults</label>
          <button class="btn btn-danger full-width" id="btn-reset-data">🔄 Reset to Default Factory Dataset</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</body>
</html>
